<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">

  <!-- Background -->
  <rect width="400" height="280" fill="#000000"/>

  <!-- Main horizontal timeline line -->
  <line x1="44" y1="140" x2="340" y2="140" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

  <!-- Arrow head at the right -->
  <polygon points="344,140 326,129 326,151" fill="#ffffff"/>

  <!-- Node 1 (x=80) — branch going up -->
  <line x1="80" y1="140" x2="80" y2="82" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="62" y1="82" x2="98" y2="82" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="80" cy="140" r="10" fill="#000000" stroke="#ffffff" stroke-width="4"/>
  <circle cx="80" cy="140" r="4" fill="#ffffff"/>

  <!-- Node 2 (x=160) — branch going down -->
  <line x1="160" y1="140" x2="160" y2="198" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="142" y1="198" x2="178" y2="198" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="160" cy="140" r="10" fill="#000000" stroke="#ffffff" stroke-width="4"/>
  <circle cx="160" cy="140" r="4" fill="#ffffff"/>

  <!-- Node 3 (x=240) — branch going up -->
  <line x1="240" y1="140" x2="240" y2="82" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="222" y1="82" x2="258" y2="82" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="240" cy="140" r="10" fill="#000000" stroke="#ffffff" stroke-width="4"/>
  <circle cx="240" cy="140" r="4" fill="#ffffff"/>

  <!-- Node 4 (x=316) — branch going down -->
  <line x1="316" y1="140" x2="316" y2="198" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="298" y1="198" x2="334" y2="198" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="316" cy="140" r="10" fill="#000000" stroke="#ffffff" stroke-width="4"/>
  <circle cx="316" cy="140" r="4" fill="#ffffff"/>

</svg>
